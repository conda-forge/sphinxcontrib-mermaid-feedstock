schema_version: 1

context:
  name: sphinxcontrib-mermaid
  version: "2.1.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sphinxcontrib_mermaid-${{ version }}.tar.gz
  sha256: f8d7f1b2f0ad69b7ebdd5cbf532fb4ee107893b5373bc2d0e9634089c0b2cfee

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ==${{ python_min }}
    - hatchling
  run:
    - python >=${{ python_min }}
    - pyyaml
    - sphinx

tests:
  - python:
      imports:
        - sphinxcontrib
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Mermaid diagrams in yours Sphinx powered docs
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: https://github.com/mgaitan/sphinxcontrib-mermaid

extra:
  recipe-maintainers:
    - timkpaine
    - conda-forge/sphinx
    - ericpre
